[project]
name = "repoharness2"
version = "0.1.0"
description = "RepoHarness rh2: SWE agent RL safety & training-governance layer on top of verifiers v1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "verifiers",
    "pydantic>=2",
]

[project.scripts]
# S1-1 最小校验命令：读 JSON -> 判 schema 类型 -> 严格校验 -> forbidden marker 扫描。
inspect-rh2-artifact = "repoharness2.cli:entry"
# S1-9 阶段总账本：四步范式（digest 重算/report 对照/白名单/marker 扫描）+ A10 探针核对。
inspect-rh2-s1 = "repoharness2.inspect_s1:entry"

[dependency-groups]
swe = [
    # 真实 SWE 评分链路（make_test_spec / get_eval_report）需要；本机纯单测不需要
    "swebench>=4.1,<5",
]
data = [
    # S2-1 数据 ingestion 工具链（experiments/s2_1_ingestion/*）的直接依赖：
    # 按冻结 revision 取 HF parquet + strip_spec 解析。此前靠环境碰巧装有
    # （codex 轮次 6 指出），干净环境重跑必须显式声明。
    "huggingface_hub>=1.22",
    "pyarrow>=24",
    "pyyaml>=6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "torch>=2.13.0",
    # 风格工具化（review-standards.md §8）：机器可判定的问题不进审查
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoharness2"]

# verifiers pin: commit 5885ab9c54152e707af2a11797aa52c3eb1752da (2026-07, see
# docs/agentic_RL/repo_harness_rh2_workstreams/01-s0-execution-plan.md E3/C1)
[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers", rev = "5885ab9c54152e707af2a11797aa52c3eb1752da" }

# S1-1 起 rh2 以可安装包形态存在（editable 安装进 venv）：
# 一是让 tests/contracts 与后续 governance/adapters 代码能 import repoharness2，
# 二是暴露 inspect-rh2-artifact console 命令（S1-9 的 inspect-rh2-s1 沿用同模式）。
[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: 需要本机 docker daemon 的评分容器行为测试（S1-4；daemon 不可用时自动跳过，本机验收须实跑 pytest -m docker）",
]

[tool.ruff]
# review-standards.md §8：最小规则集起步（存量豁免、增量强制——新改动
# 文件不得引入新违例，自检清单项）。格式化暂不启用（并行线程冲突风险）。
line-length = 120

[tool.ruff.lint]
# E9 = 语法级错误；F = pyflakes（未定义名/未用 import/未用变量等）
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 已登记的临时挡板（review-standards.md §8 / fa/implementation-notes.md
# 权威状态页挡板登记表）：owner = S2 线程；移除条件 = S2 收敛后清理并删
# 本豁免；gate = 训前总审计前。豁免 != 问题不存在。
"experiments/s2_1_ingestion/resolve_image_digests.py" = ["F401"]
