# miles GPU spike 的 rh2 custom config（B2 生产绑定 + F2 零信号语义配套）。
#
# 注入方式：miles 启动参数 `--custom-config-path <本文件绝对路径>`。
# 解析位置：miles/utils/arguments.py `miles_validate_args` 的 custom_config_path
# 块——`yaml.safe_load(resolve_file_arg(path))` 后逐 key `setattr(args, k, v)`。
# 因此本文件里的 `true`/数值会以 Python bool/int/float 落到 args 同名属性。
# CPU 验证：tests/adapters_miles/test_gpu_spike_custom_config.py（用 miles 真实
# resolve_file_arg + 同一 yaml.safe_load/setattr 语义加载本文件并逐 key 断言）。
#
# 纪律：本文件只承载"miles 没有一等 CLI 旗标、只能经 custom-config setattr
# 注入"的 rh2 绑定 key;每个 key 必须指认消费者;增删 key 必须同步改
# test_gpu_spike_custom_config.py 的整 dict 断言（可审计变更）。

# 消费者：repoharness2/adapters/slime/generate.py 的 capture wire 分支开关。
# True = capture wire 走新 `return_sampling_mask` 顶层约定（旧 slime top-p
# tape 约定关闭）,mask 纵链（capture→装配→投影→canonicalize→conversion）
# 启用;缺省 False = 旧 slime 链逐字不变。
rh2_engine_sampling_mask: true

# 消费者：miles/backends/megatron_utils/model.py `_bump_zero_signal_fuse`
# （rh2-integration-v2,F2 零信号语义）。连续 N 个 optimizer step 的全局累计
# 梯度精确为零 → RuntimeError 熔断并输出诊断;NORMAL step 重置计数;<=0 或
# 不设 = 熔断关。8 = spike 占位值（64 samples/GBS 32 ⇒ 每次 train 2 个
# optimizer step,8 个连续零信号 step ≈ 4 个整轮全零——dynamic filter 开启后
# 仍连续全零属重大异常,该停下来看分布而不是烧卡）;正式阈值按 GPU spike
# 实测零信号频率再定（T1,运行策略非算法语义）。
max_consecutive_zero_signal_steps: 8

# 消费者：miles/backends/megatron_utils/model_provider.py（`getattr(args,
# "moe_aux_loss_coeff", None)` 非 None 时覆写 provider 值;provider 缺省来自
# HF config 转换,不保证为 0）。F2 前提 = faithful DIS policy loss 是唯一
# 训练目标（"total gradient 精确为零 ⇔ policy signal 为零"）,MoE aux loss
# 必须显式置 0——否则零 advantage 批会因 aux 梯度非零被误判 NORMAL 并照常
# optimizer.step。其余目标（MTP/OPD/KL/entropy）经启动参数关闭,见
# launch_args.md §3.1。
moe_aux_loss_coeff: 0.0
