issue: "Parser errors for an incomplete key at the end of a document without a trailing\
  \ newline should point at the incomplete key position rather than the document end.\n\
  \nVisible constraints:\n- work only inside the provided frozen repository workspace\n\
  - do not use network access during verifier execution\n- do not inspect evaluator-only\
  \ evidence or hidden tests\n\nAccepted-run execution guidance:\n- This run is only\
  \ useful if you create a durable source patch in the repository.\n- Do not finish\
  \ with an analysis-only answer.\n- You cannot see hidden tests or evaluator-only\
  \ evidence; infer the fix from the public task statement and repository code only.\n\
  - Do not call tools. Return exactly one unified diff patch for the repository.\n\
  - The patch must start with standard diff headers such as `diff --git`, `---`, `+++`,\
  \ and `@@` hunks.\n\nPublic source context from the frozen repository archive, not\
  \ evaluator-only evidence:\nFile: `unstable/parser.go`\n```go\nfunc (p *Parser)\
  \ parseKeyval(b []byte) (reference, []byte, error) {\n\t// keyval = key keyval-sep\
  \ val\n\t// Track the start position for Raw range\n\tstartB := b\n\n\tref := p.builder.Push(Node{\n\
  \t\tKind: KeyValue,\n\t})\n\n\tkey, b, err := p.parseKey(b)\n\tif err != nil {\n\
  \t\treturn invalidReference, nil, err\n\t}\n\n\t// keyval-sep = ws %x3D ws ; =\n\
  \n\tb = p.parseWhitespace(b)\n\n\tif len(b) == 0 {\n\t\treturn invalidReference,\
  \ nil, NewParserError(b, \"expected = after a key, but the document ends there\"\
  )\n\t}\n\n\tb, err = expect('=', b)\n\tif err != nil {\n\t\treturn invalidReference,\
  \ nil, err\n\t}\n\n\tb = p.parseWhitespace(b)\n\n\tvalRef, b, err := p.parseVal(b)\n\
  \tif err != nil {\n\t\treturn ref, b, err\n\t}\n\n\tp.builder.Chain(valRef, key)\n\
  \tp.builder.AttachChild(ref, valRef)\n\n\t// Set Raw to span the entire key-value\
  \ expression\n\tnode := p.builder.NodeAt(ref)\n\tnode.Raw = p.rangeOfToken(startB[:len(startB)-len(b)],\
  \ b)\n\n\treturn ref, b, err\n}\n```"
